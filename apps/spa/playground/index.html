<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground - squinch</title>
    <meta name="description" content="Try Squinch in your browser: write an architecture diagram as code and watch it render - zoom into any system, walk a flow, export SVG, PNG or interactive HTML. Nothing you draw leaves the page." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141416" />
    <!--site-head-->
    <script>
      // Same source of truth App.tsx's theme useState reads on mount
      // (localStorage "squinch:theme", falling back to the OS) — stamped here
      // too so the first paint already matches instead of flashing light and
      // then flipping once React's effect runs. No matchMedia change
      // listener: unlike the static pages, this app doesn't live-follow the
      // OS after mount either (an explicit choice, or the OS reading at
      // load, wins until the next reload).
      const stored = localStorage.getItem("squinch:theme");
      document.documentElement.dataset.theme =
        stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
