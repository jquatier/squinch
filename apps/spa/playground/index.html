    <script>
      // Same source of truth App.tsx's theme useState reads on mount
      // (localStorage "squinch:theme", falling back to the OS) — stamped here
      // too so the first paint already matches instead of flashing light and
      // then flipping once React's effect runs. No matchMedia change
      // listener: unlike the static pages, this app doesn't live-follow the
      // OS after mount either (an explicit choice, or the OS reading at
      // load, wins until the next reload).
      const stored = localStorage.getItem("squinch:theme");
      document.documentElement.dataset.theme =
        stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
