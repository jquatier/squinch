<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>squinch montage</title>
<style>
/*{{FONT_FACES}}*/
:root {
/*{{TOKENS}}*/
}
html, body { margin: 0; background: var(--canvas); }
/* The reel is a pure function of time: scripts/montage-video.mts pauses every
   animation and seeks it, so nothing here reads a clock. One loop (its length is computed in montage/dive.mts); every
   keyframe percentage is a fraction of it (1 s = 3.257 %). The two zoom dives
   and their rings are computed from the rendered shop SVGs and spliced in at
   the placeholder below; all colours are theme tokens. There are no
   will-change hints on purpose: they pin a layer's raster scale and blur the zooms. */



/*{{TIMELINE_KEYFRAMES}}*/
/*{{DIVE_KEYFRAMES}}*/
</style>
</head>
<body>
<div style="position: relative; width: 940px; height: 780px; overflow: hidden; background: var(--canvas); color: var(--fg); font-family: Inter, system-ui, sans-serif">

  <!-- Scene 1 · the wall: every kind of view drifting past, then the pitch -->
  <div style="position: absolute; inset: 0; opacity: 0; animation: sq-wall {{LOOP}}s linear infinite">
    <div style="position: absolute; left: 470px; top: 390px; display: flex; flex-direction: column; align-items: center; gap: 14px; transform: translate(-50%, -50%) rotate(-10deg)">
      <!--{{WALL}}-->
    </div>
    <div style="position: absolute; left: 0; bottom: 78px; padding: 26px 54px 30px 58px; background: var(--canvas); border: 1px solid var(--line-strong); border-left: 0; animation: sq-band {{LOOP}}s cubic-bezier(.2,.8,.2,1) infinite">
      <div style="font-size: 64px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.02">So many<br>possibilities.</div>
    </div>
  </div>

  <!-- Scene 2 · the ask, the work, the picture -->
  <div style="position: absolute; inset: 0; opacity: 0; animation: sq-app {{LOOP}}s linear infinite">

    <!-- the prompt: large and centred, then a bar across the top -->
    <div style="position: absolute; left: 70px; top: 300px; width: 800px; height: 160px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 70px var(--shadow); font-size: 34px; font-weight: 500; animation: sq-card {{LOOP}}s cubic-bezier(.6,0,.2,1) infinite">
      <span style="color: var(--accent); font-weight: 600; line-height: 1">›</span>
      <span style="display: inline-block; white-space: nowrap; clip-path: inset(0 100% 0 0); animation: sq-type {{LOOP}}s steps(16, end) infinite; animation-delay: 3.8s">diagram this app</span>
      <span aria-hidden="true" style="position: absolute; left: 62px; top: 50%; margin-top: -0.55em; width: 3px; height: 1.1em; opacity: 0; animation: sq-caretwin {{LOOP}}s linear infinite">
        <span style="display: block; width: 3px; height: 1.1em; background: var(--fg); animation: sq-blink 1.06s steps(1, end) infinite"></span>
      </span>
    </div>

    <!-- what the agent does, until the picture arrives -->
    <div style="position: absolute; left: 36px; top: 112px; display: flex; flex-direction: column; gap: 16px; font-size: 22px; font-weight: 500; animation: sq-lines {{LOOP}}s linear infinite">
      <div style="display: flex; gap: 14px; align-items: center; opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: 5.8s"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ok)"></span><span>Using the <span style="color: var(--accent)">squinch</span> skill</span></div>
      <div style="display: flex; gap: 14px; align-items: center; opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: 6.4s"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ok)"></span><span>Reading the repo <span style="color: var(--muted)">· {{COUNTS}}</span></span></div>
      <div style="display: flex; gap: 14px; align-items: center; opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: 7s"><span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ok)"></span><span>Writing <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px; color: var(--muted)">architecture/shop.squinch</span></span></div>
      <div style="margin-top: 8px; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: 7.6s">Done. An overview, plus a page for each service.</div>
    </div>

    <!-- the picture: landscape, zoom into the app, zoom into its database -->
    <div style="position: absolute; left: 30px; top: 108px; width: 880px; opacity: 0; transform: translateY(36px); animation: sq-pane {{LOOP}}s cubic-bezier(.2,.8,.2,1) infinite">
      <div style="position: relative; width: 880px; height: 664px; background: var(--canvas); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 24px 70px var(--shadow); overflow: hidden">
        <div style="position: absolute; inset: 48px 0 0 0; opacity: 0; animation: sq-A {{LOOP}}s linear infinite">
          <!--{{shop:landscape}}-->
          <div aria-hidden="true" style="position: absolute; {{RING_A}}; box-sizing: border-box; border: 2px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 4px var(--accent-25), 0 0 26px var(--accent-55); opacity: 0; animation: sq-ringA {{LOOP}}s linear infinite"></div>
        </div>
        <div style="position: absolute; inset: 48px 0 0 0; opacity: 0; animation: sq-B {{LOOP}}s linear infinite">
          <!--{{shop:service}}-->
          <div aria-hidden="true" style="position: absolute; {{RING_B}}; box-sizing: border-box; border: 2px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 4px var(--accent-25), 0 0 26px var(--accent-55); opacity: 0; animation: sq-ringB {{LOOP}}s linear infinite"></div>
        </div>
        <div style="position: absolute; inset: 48px 0 0 0; opacity: 0; animation: sq-C {{LOOP}}s linear infinite">
          <!--{{shop:database}}-->
        </div>
        <nav aria-label="Views" style="position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; align-items: center; transform: scale(1.15); transform-origin: 0 0; opacity: 1; animation: sq-bar1 {{LOOP}}s linear infinite">
          <div style="display: flex; align-items: center; gap: 1px; padding: 3px; border-radius: 9px; background: var(--pill); box-shadow: 0 0 0 1px var(--line); font-family: Inter, system-ui, sans-serif"><span style="display: flex; flex: none; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 6px; background: var(--control); color: var(--accent)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.25 8 2.75l5.5 4.5"/><path d="M4 6.25v6.25a1 1 0 0 0 1 1h2V10h2v3.5h2a1 1 0 0 0 1-1V6.25"/></svg></span><span style="flex: none; width: 1px; height: 16px; margin: 0 4px; background: var(--line)"></span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 8px 0 10px; font-size: 12.5px; font-style: italic; color: var(--ghost)">8 inside<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--text-3)"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></span></div>
        </nav>
        <nav aria-label="Views" style="position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; align-items: center; transform: scale(1.15); transform-origin: 0 0; opacity: 0; animation: sq-bar2 {{LOOP}}s linear infinite">
          <div style="display: flex; align-items: center; gap: 1px; padding: 3px; border-radius: 9px; background: var(--pill); box-shadow: 0 0 0 1px var(--line); font-family: Inter, system-ui, sans-serif"><span style="display: flex; flex: none; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.25 8 2.75l5.5 4.5"/><path d="M4 6.25v6.25a1 1 0 0 0 1 1h2V10h2v3.5h2a1 1 0 0 0 1-1V6.25"/></svg></span><span style="flex: none; width: 1px; height: 16px; margin: 0 4px; background: var(--line)"></span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 8px 0 10px; font-size: 12.5px; font-weight: 600; color: var(--fg)">Orders<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--text-3)"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></span><span style="padding: 0 1px; font-size: 13px; color: var(--line-strong)">/</span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 8px 0 10px; font-size: 12.5px; font-style: italic; color: var(--ghost)">1 lens<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--text-3)"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></span><span style="padding: 0 1px; font-size: 13px; color: var(--line-strong)">/</span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 10px 0 10px; font-size: 12.5px; font-style: italic; color: var(--ghost)">1 inside</span></div>
        </nav>
        <nav aria-label="Views" style="position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; align-items: center; transform: scale(1.15); transform-origin: 0 0; opacity: 0; animation: sq-bar3 {{LOOP}}s linear infinite">
          <div style="display: flex; align-items: center; gap: 1px; padding: 3px; border-radius: 9px; background: var(--pill); box-shadow: 0 0 0 1px var(--line); font-family: Inter, system-ui, sans-serif"><span style="display: flex; flex: none; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted)"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.25 8 2.75l5.5 4.5"/><path d="M4 6.25v6.25a1 1 0 0 0 1 1h2V10h2v3.5h2a1 1 0 0 0 1-1V6.25"/></svg></span><span style="flex: none; width: 1px; height: 16px; margin: 0 4px; background: var(--line)"></span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 8px 0 10px; font-size: 12.5px; color: var(--muted)">Orders<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--text-3)"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></span><span style="padding: 0 1px; font-size: 13px; color: var(--line-strong)">/</span><span style="display: flex; align-items: center; gap: 4px; height: 28px; white-space: nowrap; border-radius: 6px; padding: 0 10px 0 10px; font-size: 12.5px; font-weight: 600; color: var(--fg)">Postgres</span></div>
        </nav>
      </div>
    </div>
  </div>
  <!-- Scene 3 · montage -->
  <div style="position: absolute; inset: 0; opacity: 0; animation: sq-mont {{LOOP}}s linear infinite">
    <img src="{{board:microservices.full}}" alt="microservices, every service open" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m0 {{LOOP}}s linear infinite">
    <img src="{{board:06-dense-mesh.mesh}}" alt="a dense mesh of services" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m1 {{LOOP}}s linear infinite">
    <img src="{{board:27-k8s.cluster}}" alt="a Kubernetes cluster" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m2 {{LOOP}}s linear infinite">
    <img src="{{board:29-google-cloud.platform}}" alt="a Google Cloud platform" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m3 {{LOOP}}s linear infinite">
    <img src="{{board:28-azure.storefront}}" alt="an Azure storefront" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m4 {{LOOP}}s linear infinite">
    <img src="{{board:14-sidecar-routes.app}}" alt="an app with sidecars" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m5 {{LOOP}}s linear infinite">
    <img src="{{board:17-zones.landscape}}" alt="a hybrid estate in zones" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m6 {{LOOP}}s linear infinite">
    <img src="{{board:30-badges.lakehouse}}" alt="a lakehouse platform" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m7 {{LOOP}}s linear infinite">
    <img src="{{board:43-fields.overview}}" alt="tables with their schemas" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m8 {{LOOP}}s linear infinite">
    <img src="{{board:38-container-direction.load}}" alt="a load path, laid out rightward" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m9 {{LOOP}}s linear infinite">
    <img src="{{board:41-preview-card.landscape}}" alt="cards that preview their children" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m10 {{LOOP}}s linear infinite">
    <img src="{{board:21-logos.landscape}}" alt="a stack of vendor logos" style="position: absolute; left: 20px; top: 30px; width: 900px; height: 720px; object-fit: contain; opacity: 0; animation: sq-m11 {{LOOP}}s linear infinite">
  </div>
  <!-- Scene 4 · the close -->
  <div style="position: absolute; inset: 0; opacity: 0; transform: translateY(14px); animation: sq-inst {{LOOP}}s linear infinite">
    <div style="position: absolute; left: 70px; top: 292px; width: 800px; box-sizing: border-box; padding: 40px 44px; display: flex; flex-direction: column; gap: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 70px var(--shadow)">
      <div style="display: flex; align-items: baseline; gap: 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 34px; font-weight: 500">
        <span style="color: var(--accent); font-weight: 600">$</span>
        <span style="display: inline-block; white-space: nowrap; clip-path: inset(0 100% 0 0); animation: sq-type2 {{LOOP}}s steps(16, end) infinite; animation-delay: {{T_INST_1}}s">npm i -g squinch</span>
        <span style="margin-left: auto; font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 500; color: var(--muted); opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: {{T_INST_N1}}s">the CLI</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 20px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 34px; font-weight: 500">
        <span style="color: var(--accent); font-weight: 600">$</span>
        <span style="display: inline-block; white-space: nowrap; clip-path: inset(0 100% 0 0); animation: sq-type2 {{LOOP}}s steps(17, end) infinite; animation-delay: {{T_INST_2}}s">npx squinch skill</span>
        <span style="margin-left: auto; font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: 500; color: var(--muted); opacity: 0; animation: sq-line {{LOOP}}s ease-out infinite; animation-delay: {{T_INST_N2}}s">teach your agent</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
