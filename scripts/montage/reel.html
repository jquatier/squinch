<style>
/*{{FONT_FACES}}*/
:root {
/*{{TOKENS}}*/
}
html, body { margin: 0; background: var(--canvas); }
/* The reel is a pure function of time: scripts/montage-video.mts pauses every
   animation and seeks it, so nothing here reads a clock. One 30.7 s loop; every
   keyframe percentage is a fraction of it (1 s = 3.257 %). The two zoom dives
   and their rings are computed from the rendered shop SVGs and spliced in at
   the placeholder below; all colours are theme tokens. There are no
   will-change hints on purpose: they pin a layer's raster scale and blur the zooms. */

/* One 30.7s loop at the prompt GIF's size, 940 x 780. 1s = 4.167%. */

/* 0–3.5s · the wall */
@keyframes sq-wall{0%{opacity:0}1.306%{opacity:1}8.795%{opacity:1}11.398%{opacity:0}100%{opacity:0}}
@keyframes sq-driftA{0%{transform:translateX(0)}11.398%{transform:translateX(-210px)}100%{transform:translateX(-210px)}}
@keyframes sq-driftB{0%{transform:translateX(-210px)}11.398%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes sq-band{0%{transform:translateX(-110%)}0.978%{transform:translateX(-110%)}2.932%{transform:translateX(0)}8.145%{transform:translateX(0)}10.421%{transform:translateX(-110%)}100%{transform:translateX(-110%)}}

/* 3–23.6s · the ask, the work, the picture */
/* The prompt card starts large and centred, then shrinks to a bar on top */
@keyframes sq-card{
  0%{left:70px;top:300px;width:800px;height:160px;font-size:34px}
  16.284%{left:70px;top:300px;width:800px;height:160px;font-size:34px}
  18.238%{left:30px;top:28px;width:880px;height:56px;font-size:22px}
  100%{left:30px;top:28px;width:880px;height:56px;font-size:22px}}
@keyframes sq-caretwin{0%{opacity:1}12.351%{opacity:1}12.43%{opacity:0}100%{opacity:0}}
@keyframes sq-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
/* The two dives. One camera, two layers: the outgoing picture scales up about
   the card that was clicked while that card travels to the middle of the pane;
   the incoming picture is that card's interior, so it grows from the card's size
   in lockstep and its centre rides the card's centre. Stops are baked with an
   ease-in-out and an exponential scale so the zoom keeps one apparent speed.
   Dive 1 runs 11.2–12.7s, dive 2 runs 16.0–17.5s. */
/* Late starters carry an animation-delay and put themselves away before the loop wraps, so the next pass never shows stale text. */
@keyframes sq-type{0%{clip-path:inset(0 100% 0 0)}3.257%{clip-path:inset(0 -2px 0 0)}78.176%{clip-path:inset(0 -2px 0 0)}78.502%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}
@keyframes sq-line{0%{opacity:0;transform:translateY(8px)}1.173%{opacity:1;transform:translateY(0)}66.775%{opacity:1;transform:translateY(0)}67.101%{opacity:0;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
@keyframes sq-lines{0%{opacity:1}28.339%{opacity:1}30.945%{opacity:0}100%{opacity:0}}
@keyframes sq-pane{0%{opacity:0;transform:translateY(36px)}29.316%{opacity:0;transform:translateY(36px)}31.922%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
/*{{DIVE_KEYFRAMES}}*/
@keyframes sq-app{0%{opacity:0}9.772%{opacity:0}11.726%{opacity:1}60.586%{opacity:1}63.844%{opacity:0}100%{opacity:0}}
/* 19.6–24.8s · the montage: twelve of the densest views in the corpus, cutting faster */
@keyframes sq-mont{0%{opacity:0}63.518%{opacity:0}63.844%{opacity:1}81.075%{opacity:1}82.704%{opacity:0}100%{opacity:0}}
@keyframes sq-m0{0%{opacity:0;transform:scale(1.06)}63.844%{opacity:0;transform:scale(1.06)}63.909%{opacity:1;transform:scale(1.06)}64.658%{opacity:1;transform:scale(1)}66.124%{opacity:1;transform:scale(1)}66.189%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m1{0%{opacity:0;transform:scale(1.06)}66.124%{opacity:0;transform:scale(1.06)}66.189%{opacity:1;transform:scale(1.06)}66.938%{opacity:1;transform:scale(1)}68.143%{opacity:1;transform:scale(1)}68.208%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m2{0%{opacity:0;transform:scale(1.06)}68.143%{opacity:0;transform:scale(1.06)}68.208%{opacity:1;transform:scale(1.06)}68.958%{opacity:1;transform:scale(1)}69.935%{opacity:1;transform:scale(1)}70%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m3{0%{opacity:0;transform:scale(1.06)}69.935%{opacity:0;transform:scale(1.06)}70%{opacity:1;transform:scale(1.06)}70.749%{opacity:1;transform:scale(1)}71.564%{opacity:1;transform:scale(1)}71.629%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m4{0%{opacity:0;transform:scale(1.06)}71.564%{opacity:0;transform:scale(1.06)}71.629%{opacity:1;transform:scale(1.06)}72.378%{opacity:1;transform:scale(1)}73.029%{opacity:1;transform:scale(1)}73.094%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m5{0%{opacity:0;transform:scale(1.06)}73.029%{opacity:0;transform:scale(1.06)}73.094%{opacity:1;transform:scale(1.06)}73.844%{opacity:1;transform:scale(1)}74.397%{opacity:1;transform:scale(1)}74.463%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m6{0%{opacity:0;transform:scale(1.06)}74.397%{opacity:0;transform:scale(1.06)}74.463%{opacity:1;transform:scale(1.06)}75.212%{opacity:1;transform:scale(1)}75.635%{opacity:1;transform:scale(1)}75.7%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m7{0%{opacity:0;transform:scale(1.06)}75.635%{opacity:0;transform:scale(1.06)}75.7%{opacity:1;transform:scale(1.06)}76.433%{opacity:1;transform:scale(1)}76.775%{opacity:1;transform:scale(1)}76.84%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m8{0%{opacity:0;transform:scale(1.06)}76.775%{opacity:0;transform:scale(1.06)}76.84%{opacity:1;transform:scale(1.06)}77.505%{opacity:1;transform:scale(1)}77.818%{opacity:1;transform:scale(1)}77.883%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m9{0%{opacity:0;transform:scale(1.06)}77.818%{opacity:0;transform:scale(1.06)}77.883%{opacity:1;transform:scale(1.06)}78.502%{opacity:1;transform:scale(1)}78.795%{opacity:1;transform:scale(1)}78.86%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m10{0%{opacity:0;transform:scale(1.06)}78.795%{opacity:0;transform:scale(1.06)}78.86%{opacity:1;transform:scale(1.06)}79.479%{opacity:1;transform:scale(1)}79.772%{opacity:1;transform:scale(1)}79.837%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes sq-m11{0%{opacity:0;transform:scale(1.06)}79.772%{opacity:0;transform:scale(1.06)}79.837%{opacity:1;transform:scale(1.06)}80.456%{opacity:1;transform:scale(1)}80.749%{opacity:1;transform:scale(1)}80.814%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
/* 25.1–30.6s · the close: the two install commands, typed */
@keyframes sq-inst{0%{opacity:0;transform:translateY(14px)}81.759%{opacity:0;transform:translateY(14px)}83.713%{opacity:1;transform:translateY(0)}98.371%{opacity:1;transform:translateY(0)}99.674%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes sq-type2{0%{clip-path:inset(0 100% 0 0)}2.932%{clip-path:inset(0 -2px 0 0)}21.173%{clip-path:inset(0 -2px 0 0)}21.498%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}
/* The view bar, as the playground draws it: home, then one hop per altitude. It changes as each zoom lands. */
@keyframes sq-bar1{0%{opacity:1}39.414%{opacity:1}40.717%{opacity:0}100%{opacity:0}}
@keyframes sq-bar2{0%{opacity:0}39.414%{opacity:0}40.717%{opacity:1}49.511%{opacity:1}50.814%{opacity:0}100%{opacity:0}}
@keyframes sq-bar3{0%{opacity:0}49.511%{opacity:0}50.814%{opacity:1}100%{opacity:1}}
</style>
