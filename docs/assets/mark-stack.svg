<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 460 532">
  <defs>
    <linearGradient id="sqs-a" gradientUnits="userSpaceOnUse" x1="665.32672" y1="409.36929" x2="913.75134" y2="597.70557"><stop offset="0" stop-color="#7858FF"/><stop offset="1" stop-color="#15B6FF"/></linearGradient>
    <linearGradient id="sqs-b" gradientUnits="userSpaceOnUse" x1="617.05377" y1="230.70036" x2="851.11438" y2="412.6394"><stop offset="0" stop-color="#C441FE"/><stop offset="1" stop-color="#3585FF"/></linearGradient>
    <linearGradient id="sqs-top" gradientUnits="userSpaceOnUse" x1="33.5" y1="225" x2="254" y2="351"><stop offset="0" stop-color="#C441FE"/><stop offset="0.5" stop-color="#3585FF"/><stop offset="1" stop-color="#15B6FF"/></linearGradient>
    <linearGradient id="sqs-mid" gradientUnits="userSpaceOnUse" x1="33.5" y1="330" x2="254" y2="456"><stop offset="0" stop-color="#C441FE"/><stop offset="0.5" stop-color="#3585FF"/><stop offset="1" stop-color="#15B6FF"/></linearGradient>

    <!-- Every plane fades out toward its far (top) vertex and is full strength
         from its waist down. Without it a plane's back edges cut a bright line
         straight through the S's counters, which the original never does — it
         is the single detail that most makes the stack read as depth. Sampling
         the original's top plane gives ~0 at the top vertex, ~0.5 halfway and
         1 at the waist: a linear ramp over exactly the plane's half-height. -->
    <linearGradient id="sqs-fade-top" gradientUnits="userSpaceOnUse" x1="0" y1="99" x2="0" y2="225"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="sqs-fade-mid" gradientUnits="userSpaceOnUse" x1="0" y1="204" x2="0" y2="330"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="sqs-fade-bot" gradientUnits="userSpaceOnUse" x1="0" y1="294" x2="0" y2="420"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>

    <!-- …and a nearer plane hides a farther one outright, so you never see
         through the stack. A standalone mark cannot paint an opaque fill —
         that would have to be the page's own background colour, which it
         cannot know — so the occlusion is masking instead, which works on any
         ground. Fade and occlusion share one mask per plane: the ramp supplies
         the greys, the nearer silhouettes punch the holes. -->
    <mask id="sqs-plane-top" maskUnits="userSpaceOnUse" x="24" y="24" width="460" height="532">
      <rect x="24" y="24" width="460" height="532" fill="url(#sqs-fade-top)"/>
    </mask>
    <mask id="sqs-plane-mid" maskUnits="userSpaceOnUse" x="24" y="24" width="460" height="532">
      <rect x="24" y="24" width="460" height="532" fill="url(#sqs-fade-mid)"/>
      <path d="M54.34 236.91Q33.5 225 54.34 213.09L233.16 110.91Q254 99 274.84 110.91L453.66 213.09Q474.5 225 453.66 236.91L274.84 339.09Q254 351 233.16 339.09Z" fill="#000"/>
    </mask>
    <mask id="sqs-plane-bot" maskUnits="userSpaceOnUse" x="24" y="24" width="460" height="532">
      <rect x="24" y="24" width="460" height="532" fill="url(#sqs-fade-bot)"/>
      <path d="M54.34 236.91Q33.5 225 54.34 213.09L233.16 110.91Q254 99 274.84 110.91L453.66 213.09Q474.5 225 453.66 236.91L274.84 339.09Q254 351 233.16 339.09Z" fill="#000"/>
      <path d="M54.34 341.91Q33.5 330 54.34 318.09L233.16 215.91Q254 204 274.84 215.91L453.66 318.09Q474.5 330 453.66 341.91L274.84 444.09Q254 456 233.16 444.09Z" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- corner posts, left and right only: the original has none front or back -->
    <g stroke="#8F949C" stroke-width="2" stroke-dasharray="5 6" opacity="0.4">
      <path d="M43.92 225L43.92 420"/>
      <path d="M464.08 225L464.08 420"/>
    </g>

    <!-- bottom plane: dashed, carrying the wired graph -->
    <g mask="url(#sqs-plane-bot)">
      <path d="M54.34 431.91Q33.5 420 54.34 408.09L233.16 305.91Q254 294 274.84 305.91L453.66 408.09Q474.5 420 453.66 431.91L274.84 534.09Q254 546 233.16 534.09Z" stroke="#8F949C" stroke-width="1.9" stroke-dasharray="6.8 8.2"/>
      <g stroke="#15B6FF" stroke-width="3">
        <path d="M160.76 442.32L239.75 487.45"/>
        <path d="M269.36 487.45L347.79 442.64"/>
        <ellipse cx="145.95" cy="433.86" rx="19.5" ry="13"/><ellipse cx="254.55" cy="495.92" rx="19.5" ry="13"/><ellipse cx="362.6" cy="434.18" rx="19.5" ry="13"/>
      </g>
    </g>

    <!-- middle plane: the components -->
    <g mask="url(#sqs-plane-mid)">
      <path d="M54.34 341.91Q33.5 330 54.34 318.09L233.16 215.91Q254 204 274.84 215.91L453.66 318.09Q474.5 330 453.66 341.91L274.84 444.09Q254 456 233.16 444.09Z" stroke="url(#sqs-mid)" stroke-width="2.4"/>
      <g stroke="url(#sqs-mid)" stroke-width="3">
        <path d="M116.62 337.35Q112.49 334.54 116.62 331.72L130.36 322.35Q134.49 319.54 138.62 322.35L152.36 331.72Q156.49 334.54 152.36 337.35L138.62 346.72Q134.49 349.54 130.36 346.72Z"/>
        <path d="M358.18 336.28Q354.05 333.47 358.18 330.65L371.92 321.28Q376.05 318.46 380.18 321.28L393.92 330.65Q398.05 333.47 393.92 336.28L380.18 345.65Q376.05 348.47 371.92 345.65Z"/>
        <path d="M295.11 376.35Q290.98 373.53 295.11 370.72L308.85 361.35Q312.98 358.53 317.11 361.35L330.85 370.72Q334.98 373.53 330.85 376.35L317.11 385.72Q312.98 388.53 308.85 385.72Z"/>
        <path d="M236.57 409.3Q232.44 406.48 236.57 403.67L250.31 394.3Q254.44 391.48 258.57 394.3L272.31 403.67Q276.44 406.48 272.31 409.3L258.57 418.67Q254.44 421.48 250.31 418.67Z"/>
      </g>
    </g>

    <!-- top plane: what the S stands on. It sits ~15% dimmer than the middle
         one in the original, which keeps it from competing with the mark. -->
    <g mask="url(#sqs-plane-top)" opacity="0.85">
      <path d="M54.34 236.91Q33.5 225 54.34 213.09L233.16 110.91Q254 99 274.84 110.91L453.66 213.09Q474.5 225 453.66 236.91L274.84 339.09Q254 351 233.16 339.09Z" stroke="url(#sqs-top)" stroke-width="2.4"/>
    </g>
  </g>

  <g transform="translate(-181.78 -73.12) scale(0.57)">
