# NOTE: runs `npx squinch@…`. The package is published by release.yml, so this
# action works from the first tagged release onward — not before it.
name: "Squinch diagram diff"
description: "Comment on a PR with what changed in the architecture, and optionally gate on structural changes."
inputs:
  path:
    description: "Path to a .squinch file or a project directory"
    required: true
  base:
    description: "Git ref to compare against (defaults to the PR base)"
    required: false
    default: ""
  fail-on:
    description: "Fail the job on change: structural | any | none"
    required: false
    default: "none"
  comment:
    description: "Post the summary as a PR comment"
    required: false
    default: "true"
  version:
    description: "squinch version to run"
    required: false
    default: "latest"
runs:
  using: composite
  steps:
    # Pinned to a commit SHA with the tag alongside, as ci.yml does: this
    # action runs in other people's repositories, where a moved tag would
    # reach further than it does here.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
        # This action runs in someone else's repo and only needs `npx`, never a
        # dependency install. setup-node v5+ turns caching on by itself when the
        # consumer's package.json names npm in `packageManager`, and caching
        # fails outright when there is no lockfile to hash — so a repo that has
        # the field but not the file would break on a step that wants neither.
        package-manager-cache: false
    # Inputs reach the shell through the environment, never by `${{ }}` inside
    # the script: an expression is substituted as source text before bash
    # parses it, so a path or ref an author controls could be a command.
    - name: Compute the semantic diff
      id: diff
      shell: bash
      env:
        SQUINCH_PATH: ${{ inputs.path }}
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        if [ -z "$BASE" ]; then BASE="origin/$BASE_REF"; fi
        # the base ref must exist locally: actions/checkout is shallow by default
        git fetch --no-tags --depth=1 origin "$BASE_REF" || true
        REPORT=$(npx --yes squinch@${{ inputs.version }} diff "$SQUINCH_PATH" \
          --base "$BASE" --format markdown || true)
        {
          echo 'report<<SQUINCH_EOF'
          echo "$REPORT"
          echo 'SQUINCH_EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        # The report quotes diagram labels verbatim (packages/core/src/diff),
        # so it is the PR author's text. Read it from the environment rather
        # than splicing it into the script, where a backtick in a label would
        # end the string and run whatever follows.
        REPORT: ${{ steps.diff.outputs.report }}
      with:
        script: |
          const body = process.env.REPORT ?? "";
          if (!body.trim()) return;
          // one comment per PR, updated in place — a review thread should not
          // fill up with a new diagram summary on every push
          const marker = "<!-- squinch-diff -->";
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo, issue_number: context.issue.number,
          });
          const mine = comments.find((c) => c.body?.includes(marker));
          const payload = `${marker}\n${body}`;
          if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: payload });
          else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: payload });
    - name: Gate on the change weight
      if: ${{ inputs.fail-on != 'none' }}
      shell: bash
      env:
        SQUINCH_PATH: ${{ inputs.path }}
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        if [ -z "$BASE" ]; then BASE="origin/$BASE_REF"; fi
        npx --yes squinch@${{ inputs.version }} diff "$SQUINCH_PATH" \
          --base "$BASE" --fail-on "${{ inputs.fail-on }}"
