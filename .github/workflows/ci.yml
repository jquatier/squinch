name: ci
on:
  # Branch pushes only — a bare `push` also fires on tags, and tags are
  # release.yml's job; one tag should produce exactly one relevant run.
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Runner-side Node, not ours: these majors are the first that ship a
      # node24 entry point. The floating @v4 tags are still node20, which the
      # runner now force-upgrades while warning — it works, but on someone
      # else's schedule rather than ours.
      - uses: actions/checkout@v7
      # Before setup-node, which needs pnpm on PATH to locate the store it
      # caches. Reads the version from `packageManager` in package.json
      # (pnpm@11.5.2) — and pnpm 11 is what action-setup v6 added support for.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm -r builds in dependency order: core (emits .d.ts) then cli
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # Golden SVGs are committed from macOS — Linux must byte-match them.
      - run: pnpm -r test
      # Dogfood: the repo's own committed diagrams must stay in sync.
      - run: node packages/cli/bin/squinch.js render examples/orders --check
      - run: node packages/cli/bin/squinch.js render examples/products-api --check
      - run: node packages/cli/bin/squinch.js render examples/storefront --check
      - run: node packages/cli/bin/squinch.js render examples/microservices --check
      - run: node packages/cli/bin/squinch.js render examples/notifications --check
      # the playground must keep building (it embeds core via the browser entry)
      - run: pnpm --filter @squinch/spa build
      # The exported viewer is bundled ahead of time and committed, so that
      # rendering never runs esbuild and its bytes cannot drift with an upgrade.
      # Same drift gate as the lookbook: regenerate, diff clean.
      - run: cd packages/core && npx tsx scripts/gen-html-runtime.ts
      - run: git diff --exit-code packages/core/src/render/html/runtime.generated.ts
      # …and its embedded copy of examples/ + lookbook/cases/ must be current.
      # The build regenerates src/examples.ts, but nothing compared it, so an
      # edit to a lookbook case shipped a stale example to the playground for a
      # whole session. Same gate the lookbook itself has, one line later.
      - run: git diff --exit-code apps/spa/src/examples.ts
      # The CLI's bundled copy of the agent skill must match the canonical file.
      - run: node scripts/gen-skill.mjs
      - run: git diff --exit-code packages/cli/src/skill.generated.ts
      # Phase-3 gauntlet solutions must stay green (regression over the skill+DSL)
      - run: pnpm --filter @squinch/gauntlet score
      # PLAN §2 performance budgets are acceptance criteria, not aspirations
      - run: pnpm --filter @squinch/core bench
      # The lookbook (DESIGN §9) is snapshot-locked: regenerate and diff clean.
      - run: npx tsx lookbook/build.ts
      - run: git diff --exit-code lookbook/

  # Windows, as its own job rather than a third matrix entry: folding it in
  # would mean `if: runner.os != 'Windows'` on the steps it skips, which is
  # exactly the job that claims to cover a platform while silently stepping
  # around the thing that breaks there.
  #
  # What this proves that the other job cannot: package scripts running under
  # cmd.exe (npm does not use bash on Windows — core's build ended in `mkdir -p`
  # and `cp`, and died there), native modules loading on win32, path separators
  # end-to-end, git's forward slashes, the absent executable bit, and the
  # goldens byte-matching a render produced on a third OS.
  #
  # Note the checkout runs with the runner's default core.autocrlf=true. That is
  # deliberate: it *is* the .gitattributes test. Do not "fix" it here.
  #
  # TODO(public): once the repo is public, Windows runner minutes stop billing
  # at 2× — fold this into the build matrix above and record a Windows bench
  # baseline so the perf budgets run here too.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        # git-bash, preinstalled. The default shell is pwsh, where `cd x && y`
        # and the diff gates' quoting are gratuitous risk. Package scripts still
        # go through cmd.exe, so the portable build script is genuinely tested.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: node packages/cli/bin/squinch.js render examples/orders --check
      - run: node packages/cli/bin/squinch.js render examples/products-api --check
      - run: node packages/cli/bin/squinch.js render examples/storefront --check
      - run: node packages/cli/bin/squinch.js render examples/microservices --check
      - run: node packages/cli/bin/squinch.js render examples/notifications --check
      - run: cd packages/core && npx tsx scripts/gen-html-runtime.ts
      - run: git diff --exit-code packages/core/src/render/html/runtime.generated.ts
      # sync-examples rather than the whole SPA build: the CRLF-sensitive half is
      # this script inlining file contents through JSON.stringify, and the vite
      # build costs a minute to prove something platform-generic.
      - run: pnpm --filter @squinch/spa sync-examples
      - run: git diff --exit-code apps/spa/src/examples.ts
      # The skill constant embeds SKILL.md via JSON.stringify — the same
      # CRLF-sensitive shape as sync-examples above.
      - run: node scripts/gen-skill.mjs
      - run: git diff --exit-code packages/cli/src/skill.generated.ts
      # The ten committed sketch renders are the direct test of the seed fix:
      # the jitter is hashed from source, so a CRLF checkout would re-roll it.
      - run: npx tsx lookbook/build.ts
      - run: git diff --exit-code lookbook/
      # Deliberately not here: bench (no Windows baseline recorded, and the
      # 500ms budget on a hosted runner is a coin flip — flaky red teaches
      # people to ignore CI), the gauntlet score (redundant with goldens for
      # platform purposes, and the slowest step), the SPA vite build, and e2e
      # (`playwright install-deps` is apt-only and the browser cache path is
      # Linux-specific).

  # The interactive HTML export, in real engines. Its load-bearing mechanism —
  # a hoisted <symbol> in one <svg> painting inside another — cannot be checked
  # headlessly: jsdom and happy-dom neither lay out nor resolve SVG references,
  # so a broken hoist passes every unit test. WebKit is not optional; Safari has
  # the longest history of <use>/clipPath cross-reference quirks and this file
  # is meant to be opened from file:// on someone else's Mac.
  #
  # Its own job: ~180 MB of browsers is not worth adding to every push's
  # critical path when the rest of the suite runs in seconds.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: cache playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Two separate installs, because only one of them is cacheable. The
      # browsers live in ~/.cache/ms-playwright and restore with the cache; the
      # shared libraries they link against are apt packages in the runner image
      # and do not. Running both behind `cache-hit != 'true'` meant the first
      # push that left pnpm-lock.yaml alone restored the binaries onto a machine
      # that never got the packages, and webkit died at exec with
      # `libevent-2.1.so.7: cannot open shared object file` (exit 127). Chromium
      # hid it — its deps are already in the image, webkit's are not. So: deps
      # every run, ~180 MB download only on a miss.
      - run: cd packages/core && npx playwright install-deps chromium webkit
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd packages/core && npx playwright install chromium webkit
      - run: pnpm --filter @squinch/core test:e2e
      # The playground's own smoke suite: does it load and work. Its 1,000
      # lines of React and DOM are unreachable from `pnpm -r test`, and CI's
      # only assertion about them used to be that they compile. Playwright
      # boots the dev server itself (chromium only — this is wiring, not
      # rendering, so the cross-engine risk that earns webkit upstairs is not
      # in play).
      - run: pnpm --filter @squinch/spa test:e2e
