name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm -r builds in dependency order: core (emits .d.ts) then cli
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # Golden SVGs are committed from macOS — Linux must byte-match them.
      - run: pnpm -r test
      # Dogfood: the repo's own committed diagrams must stay in sync.
      - run: node packages/cli/bin/squinch.js render examples/orders --check
      - run: node packages/cli/bin/squinch.js render examples/landscape --check
      - run: node packages/cli/bin/squinch.js render examples/microservices --check

  phase0:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: spike
      # Renders all cases and byte-compares against spike/golden/hashes.json —
      # macOS-generated goldens must match Linux output exactly.
      - run: npm run spike
        working-directory: spike
