# Cut by `pnpm release` (scripts/release.mjs), which bumps every manifest,
# writes the CHANGELOG section, and pushes main + the tag together. This
# workflow builds the VSIX from the tagged commit, re-runs the suite — its own
# gate, deliberately, rather than trusting that some other run was green —
# publishes the GitHub Release with the CHANGELOG section as its notes, and
# then publishes to npm. npm goes last on purpose: the GitHub Release is the
# fallback artifact, so a registry problem reddens the run without costing
# anyone the VSIX. npm authenticates by trusted publishing (OIDC, configured
# per package on npmjs.com against this repo and workflow file); NPM_TOKEN is
# the fallback for a package not yet wired up, and the first publish of a new
# package is done by hand, since npm only configures trust on a package that
# exists.
#
# Two ways it fails on purpose: the tag not matching the workspace version
# (someone tagged by hand), and the CHANGELOG missing this version's section
# (someone skipped the release command). Both are the process working.
#
# Windows and e2e are not re-run here; they gate main, and the tag points at a
# commit on main.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # npm trusted publishing: pnpm mints an OIDC token instead of using a secret

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The same pinned setup block as ci.yml, same order, same reasons: the
      # action majors are the first with node24 entry points, and pnpm must be
      # on PATH before setup-node locates the store it caches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          # writes an .npmrc wired to NODE_AUTH_TOKEN, which the publish step sets
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag IS the version. Fail before doing any work if they disagree.
      - run: |
          v="v$(node scripts/version.mjs)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $v"
            echo "releases are cut with \`pnpm release\`, which keeps them equal"
            exit 1
          fi
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter squinch-vscode package
      - run: |
          v="$(node scripts/version.mjs)"
          mv packages/vscode/squinch.vsix "squinch-vscode-${v}.vsix"
          sha256sum "squinch-vscode-${v}.vsix" > SHA256SUMS
      # Notes are the CHANGELOG section for this version, verbatim; a missing
      # section fails the release rather than shipping an empty page.
      - run: node scripts/release-notes.mjs "$(node scripts/version.mjs)" > notes.md
      - run: |
          gh release create "$GITHUB_REF_NAME" squinch-vscode-*.vsix SHA256SUMS \
            --title "squinch $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # npm last, deliberately. The GitHub Release is the artifact people can
      # always fall back to, so a registry problem — an expired token, a name
      # taken, npm being down — must not cost them the VSIX. This step failing
      # reddens the run and leaves the Release standing, which is the right way
      # round.
      #
      # `pnpm -r publish` walks in dependency order (packs → core → cli) and
      # skips every `private: true` package, which is what keeps the playground,
      # the gauntlet and the lookbook off the registry. It also rewrites
      # `workspace:*` to the real version on the way out; plain `npm publish`
      # does not, and would ship a manifest nobody can install.
      #
      # --no-git-checks: a tag build is a detached HEAD, which pnpm otherwise
      # refuses to publish from.
      #
      # Versions already on the registry are skipped, so re-running a release
      # does not fail on "you cannot publish over a published version".
      - run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
