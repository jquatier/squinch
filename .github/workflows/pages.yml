# Deploys the playground to GitHub Pages. Plumbing ships while the repo is
# private: every job is gated on repository visibility, so this workflow
# no-ops until the repo goes public and then starts deploying on its own —
# no flag to remember to flip. (Pages is not available on private free repos,
# so an ungated deploy step would fail on every push until launch.)
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job alone raises what it needs. The build
# job runs the repository's own scripts and should not hold a token that can
# publish the site or mint an identity.
permissions:
  contents: read

# One deploy at a time; a newer push supersedes a queued one but never
# cancels an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # First public run auto-enables Pages (source: GitHub Actions), so
          # going public needs no settings visit before this deploys.
          enablement: true
      # `...` pulls in the SPA's workspace dependencies: the site imports
      # @squinch/core's dist/, which only core's own build writes. The first
      # public run built the SPA alone and failed to resolve it.
      - name: Build the playground
        run: pnpm --filter "@squinch/spa..." build
        env:
          # "/<repo>" from Pages config, "" on a custom domain — either way
          # the trailing slash makes it a valid Vite base.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      # The two steps of actions/upload-pages-artifact, inlined. That composite
      # calls `actions/upload-artifact@v4` by tag from inside its own
      # action.yml, and the repository requires every action to be pinned to a
      # full commit SHA — a rule that reaches nested references too, and that
      # nothing in this file can satisfy on the composite's behalf. The tar
      # flags and the artifact name are what deploy-pages expects.
      - name: Archive the site
        run: |
          tar --dereference --hard-dereference \
            --directory apps/spa/dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
