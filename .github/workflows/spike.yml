name: spike
on: [push, pull_request]

jobs:
  phase0:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: spike
      # Renders all cases and byte-compares against spike/golden/hashes.json —
      # macOS-generated goldens must match Linux output exactly.
      - run: npm run spike
        working-directory: spike
